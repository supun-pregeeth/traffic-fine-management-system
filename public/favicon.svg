<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer premium gold circle/ring -->
  <circle cx="50" cy="50" r="48" fill="#001B3A" stroke="#C9A227" stroke-width="3" />
  
  <!-- Outer dotted track to look premium -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#C9A227" stroke-width="1" stroke-dasharray="3 3" />
  
  <!-- Police Emblem / Dharmachakra inspired wheel in center -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#C9A227" stroke-width="2" />
  <circle cx="50" cy="50" r="6" fill="#C9A227" />
  
  <!-- Spokes (8 spokes for the wheel) -->
  <line x1="50" y1="26" x2="50" y2="74" stroke="#C9A227" stroke-width="2" />
  <line x1="26" y1="50" x2="74" y2="50" stroke="#C9A227" stroke-width="2" />
  <line x1="33" y1="33" x2="67" y2="67" stroke="#C9A227" stroke-width="2" />
  <line x1="33" y1="67" x2="67" y2="33" stroke="#C9A227" stroke-width="2" />
  
  <!-- Outer rim details -->
  <text x="50" y="18" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="7" font-weight="900" text-anchor="middle" letter-spacing="1.5">POLICE</text>
  <text x="50" y="88" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="6" font-weight="900" text-anchor="middle" letter-spacing="1">SRI LANKA</text>
</svg>